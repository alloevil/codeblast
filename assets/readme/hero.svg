<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" role="img" aria-label="codeblast — deterministic code graph: know what breaks before you merge">
  <defs>
    <clipPath id="frame"><rect width="1200" height="400" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="#0d1117"/>

    <!-- 母题：从目标节点辐射的冲击波（右侧图区背景） -->
    <g transform="translate(870,200)">
      <circle r="52"  fill="none" stroke="#f85149" stroke-opacity="0.5" stroke-width="1.5"/>
      <circle r="104" fill="none" stroke="#f85149" stroke-opacity="0.3" stroke-width="1.2"/>
      <circle r="164" fill="none" stroke="#58a6ff" stroke-opacity="0.22" stroke-width="1"/>
      <circle r="230" fill="none" stroke="#58a6ff" stroke-opacity="0.12" stroke-width="1"/>
    </g>

    <!-- 左：标题系统 -->
    <g transform="translate(64,74)">
      <text font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" fill="#8b949e" letter-spacing="3">DETERMINISTIC CODE GRAPH · TS / PY</text>
      <text y="74" font-family="-apple-system,'Segoe UI',sans-serif" font-size="64" font-weight="700" fill="#e6edf3">code<tspan fill="#f85149">blast</tspan></text>
      <text y="122" font-family="-apple-system,'Segoe UI',sans-serif" font-size="27" fill="#e6edf3">Know what breaks <tspan fill="#58a6ff">before</tspan> you merge.</text>
      <text y="156" font-family="-apple-system,'Segoe UI',sans-serif" font-size="20" fill="#8b949e">Architecture · Change · Impact — 每条边带 file:line 证据</text>

      <!-- 元数据行 -->
      <g transform="translate(0,204)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">
        <rect x="-14" y="-26" width="470" height="40" rx="8" fill="#161b22" stroke="#30363d"/>
        <text fill="#3fb950">recall 28/28 = 100%</text>
        <text x="230" fill="#8b949e">mutation-tested</text>
        <text x="404" fill="#8b949e">MIT</text>
      </g>
    </g>

    <!-- 右：项目原生材料 = 真实 impact 查询（terminal 卡片） -->
    <g transform="translate(640,52)">
      <rect width="500" height="296" rx="12" fill="#161b22" stroke="#30363d"/>
      <circle cx="24" cy="24" r="5.5" fill="#f85149"/><circle cx="44" cy="24" r="5.5" fill="#d29922"/><circle cx="64" cy="24" r="5.5" fill="#3fb950"/>
      <text x="88" y="30" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" fill="#8b949e">impact — blast radius query</text>

      <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18.5">
        <text x="24" y="72"  fill="#8b949e">$ <tspan fill="#e6edf3">codeblast impact </tspan><tspan fill="#d29922">"createOrder"</tspan></text>
        <text x="24" y="106" fill="#e6edf3">impact: <tspan fill="#f85149" font-weight="700">296 nodes</tspan> <tspan fill="#8b949e">(direct=44 tests=40)</tspan></text>
        <text x="24" y="140" fill="#8b949e">├─ 调用链可达（高置信）      <tspan fill="#58a6ff">34</tspan></text>
        <text x="24" y="172" fill="#8b949e">└─ import/re-export 可达   <tspan fill="#58a6ff">262</tspan></text>
        <text x="24" y="212" fill="#e6edf3">[direct] <tspan fill="#58a6ff">nextAppDirCaller</tspan></text>
        <text x="52" y="242" fill="#8b949e">via <tspan fill="#3fb950">nextAppDirCaller.ts:55</tspan> ← 证据行</text>
        <text x="24" y="276" fill="#e6edf3">[tests]  <tspan fill="#58a6ff">websockets.test.ts</tspan> <tspan fill="#8b949e">+39</tspan></text>
      </g>
    </g>
  </g>
</svg>
