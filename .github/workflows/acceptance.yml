# 验收回归：每周 + 手动触发。护的是项目唯一的护城河——100% 召回承诺。
# 失败即开 issue（AGENTS.md: 召回率 <100% 的改动禁止合入）。
name: acceptance

on:
  schedule:
    - cron: "0 3 * * 1" # 每周一 03:00 UTC
  workflow_dispatch:
    inputs:
      mutants:
        description: "变异数量"
        default: "10"

env:
  # 基准仓钉在固定 commit：不钉的话抓到的是当天 HEAD，上游一改测得的召回就漂移。
  # tRPC 的 SHA 取 2026-08-31——本门禁最后一次通过的时代。钉到更新的 commit（如 09-12）
  # 实测召回只有 2/4 = 50%，那是真实信号（上游测试文件布局变了，impact 盖不住），
  # 但那是「上游变了」，不是「codeblast 回归了」，两者不该混在同一个红灯里。
  TRPC_SHA: 4f5315219f947589c9ef0f67b7aa551243312d61   # 2026-08-31：本门禁最后一次通过的 tRPC 时代
  GRAPHQL_TOOLS_SHA: 2a3763f514d986074e5a2bcd4d4a41274b1bda96

permissions:
  contents: read
  issues: write

jobs:
  mutation-recall:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: bun install
      - run: bun run build

      - name: Self smoke (fail-loud check)
        run: node dist/bin.js demo

      # 报告解析器自检：vitest 的 JSON 是多行的（还带 pnpm 横幅），
      # 2026-09 那次每周失败就是解析方式不对造成的（issue #45），这里把它钉住。
      - name: Parser self-check (fail-loud check)
        run: python3 eval/parser_selfcheck.py

      # filer 自检：真出回归时负责开 issue 的那两个 github-script 步骤，必须先能跑通。
      # #48 把它们同时改坏（一个 TDZ 自引用、一个引用不存在的变量），而它们只在
      # 「schedule 触发 + 有回归」时才执行 —— 每周绿灯把它盖住了，回归信号会静默丢失。
      - name: Filer self-check (fail-loud check)
        run: node eval/filer_selfcheck.mjs

      - name: Clone benchmark repo (tRPC, pinned)
        run: |
          git init -q /tmp/trpc
          git -C /tmp/trpc remote add origin https://github.com/trpc/trpc.git
          git -C /tmp/trpc fetch -q --depth 1 origin "$TRPC_SHA"
          git -C /tmp/trpc checkout -q FETCH_HEAD
          git -C /tmp/trpc log -1 --format='tRPC @ %h %ad' --date=short

      - name: Install benchmark deps
        working-directory: /tmp/trpc
        run: corepack enable && pnpm install --ignore-scripts

      - name: Build graph
        run: |
          node dist/bin.js index /tmp/trpc --db /tmp/trpc.db
          python3 -c "
          import sqlite3, sys
          c = sqlite3.connect('/tmp/trpc.db')
          files, nodes, edges = (c.execute(q).fetchone()[0] for q in
            ['SELECT COUNT(*) FROM files', 'SELECT COUNT(*) FROM nodes', 'SELECT COUNT(*) FROM edges'])
          print(f'files={files} nodes={nodes} edges={edges}')
          # 规模哨兵:文件数骤降 = 静默丢文件回归（曾丢 115 个孤儿文件）
          assert files > 900, f'file count regression: {files} < 900'
          assert edges > 15000, f'edge count regression: {edges} < 15000'
          "

      - name: Mutation testing — recall must be 100%
        id: mutation
        run: |
          python3 eval/mutation_check.py /tmp/trpc /tmp/trpc.db "${{ github.event.inputs.mutants || 10 }}" 2>&1 | tee /tmp/mutation.log
          RECALL=$(grep -oP '^recall: \d+/\d+ = \K\d+' /tmp/mutation.log || echo "0")
          echo "recall=$RECALL" >> "$GITHUB_OUTPUT"
          tail -12 /tmp/mutation.log >> "$GITHUB_STEP_SUMMARY"
          if [ "$RECALL" != "100" ]; then
            echo "::error::recall $RECALL% — below the 100% gate"
            exit 1
          fi

      - name: Open issue on regression
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // 证据：先看本步写下的 mutation 日志；若失败发生在更早的步骤（安装/建图），
            // 那份日志根本不存在 —— 此时附上失败步骤名与失败 job 的日志尾部，
            // 而不是留一句 "(log unavailable)"（issue #44 就是这样什么都没说）。
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('/tmp/mutation.log', 'utf8').slice(-3000); } catch {}
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo,
              run_id: context.runId,
            });
            const failed = jobs.data.jobs.filter(j => j.conclusion === 'failure');
            const steps = failed.flatMap(j =>
              j.steps.filter(s => s.conclusion === 'failure')
                    .map(s => `- ${j.name} → ${s.name}`)).join('\n');
            let jobLog = '';
            if (failed.length) {
              try {
                const resp = await github.rest.actions.downloadJobLogsForWorkflowRun({
                  owner: context.repo.owner, repo: context.repo.repo, job_id: failed[0].id,
                });
                jobLog = String(resp.data || '').slice(-3000);
              } catch (e) { jobLog = `(job log download failed: ${e.message})`; }
            }
            // 三段证据只写纯文本：evidence 里再套 ``` 会让 body 的代码块提前闭合（#48 的老毛病），
            // 也让「开出来的 issue」不再是一个可读的代码块。
            const evidence = [
              steps ? `Failed steps:\n${steps}` : '',
              log ? `Tail of the mutation log:\n${log}` : '(no log captured — the failing step ran before mutation testing)',
              jobLog ? `Tail of the failing job's log:\n${jobLog}` : '',
            ].filter(Boolean).join('\n\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `acceptance regression — recall gate failed (${new Date().toISOString().slice(0,10)})`,
              labels: ['acceptance-regression'],
              body: `Weekly acceptance run failed the 100% recall gate.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n\`\`\`\n${evidence}\n\`\`\``,
            });

  # 第二基准：jest 跑器（graphql-tools, npm workspaces + babel-jest）。全程 ~5 分钟（装依赖 1min + 建图 10s + 10 变异 2min）。
  # 2026-09-07: 硬门槛。此前记录的 9/10 = 90% 不是引擎缺口 —— 是 ground truth 被 flaky 测试污染
  # （packages/loaders/url/tests/yoga-compat.spec.ts 的 SSE 用例只在全量负载下偶发失败，它不 import
  # git loader）。mutation_check.py 现在对每个疑似漏报在“已还原源码”上复跑一遍：仍失败即判 flaky、
  # 从 ground truth 扣除。同一个变异点复跑后 recall 1/1，全量 10 变异 10/10。
  mutation-recall-jest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: bun install
      - run: bun run build

      # 同上：jest job 的 filer 也要先自检（#48 漏掉的正是这一半 —— 它引用了不存在的 evidence）。
      - name: Filer self-check (fail-loud check)
        run: node eval/filer_selfcheck.mjs

      - name: Clone benchmark repo (graphql-tools, pinned)
        run: |
          git init -q /tmp/graphql-tools
          git -C /tmp/graphql-tools remote add origin https://github.com/ardatan/graphql-tools.git
          git -C /tmp/graphql-tools fetch -q --depth 1 origin "$GRAPHQL_TOOLS_SHA"
          git -C /tmp/graphql-tools checkout -q FETCH_HEAD
          git -C /tmp/graphql-tools log -1 --format='graphql-tools @ %h %ad' --date=short

      - name: Install benchmark deps
        working-directory: /tmp/graphql-tools
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        # `npm ci` 会因上游自己 package.json 与 lock 不同步而拒绝（Missing: postcss@…），
        # 这里只需要「能跑测试」，不需要可复现安装 → 用 npm install
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build graph
        run: |
          node dist/bin.js index /tmp/graphql-tools --db /tmp/graphql-tools.db
          python3 -c "
          import sqlite3
          c = sqlite3.connect('/tmp/graphql-tools.db')
          files, nodes, edges = (c.execute(q).fetchone()[0] for q in
            ['SELECT COUNT(*) FROM files', 'SELECT COUNT(*) FROM nodes', 'SELECT COUNT(*) FROM edges'])
          print(f'files={files} nodes={nodes} edges={edges}')
          # 2026-09-03 基线 files=353 edges=9419
          assert files > 300, f'file count regression: {files} < 300'
          assert edges > 8000, f'edge count regression: {edges} < 8000'
          "

      - name: Mutation testing (jest) — recall must be 100%
        id: mutation
        run: |
          python3 eval/mutation_check.py /tmp/graphql-tools /tmp/graphql-tools.db "${{ github.event.inputs.mutants || 10 }}" 2>&1 | tee /tmp/mutation-jest.log
          RECALL=$(grep -oP '^recall: \d+/\d+ = \K\d+' /tmp/mutation-jest.log || echo "0")
          echo "recall=$RECALL" >> "$GITHUB_OUTPUT"
          tail -12 /tmp/mutation-jest.log >> "$GITHUB_STEP_SUMMARY"
          if [ "$RECALL" != "100" ]; then
            echo "::error::jest benchmark recall $RECALL% — below the 100% gate"
            exit 1
          fi

      - name: Open issue on regression
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            // 与 tRPC job 同样的证据采集：变异日志不存在时（失败发生在安装/建图那一步）
            // 至少留下失败步骤名与失败 job 的日志尾部，而不是只写一句 "(log unavailable)"（#44 就是这样）。
            let log = '';
            try { log = fs.readFileSync('/tmp/mutation-jest.log', 'utf8').slice(-3000); } catch {}
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo,
              run_id: context.runId,
            });
            const failed = jobs.data.jobs.filter(j => j.conclusion === 'failure');
            const steps = failed.flatMap(j =>
              j.steps.filter(s => s.conclusion === 'failure')
                    .map(s => `- ${j.name} → ${s.name}`)).join('\n');
            let jobLog = '';
            if (failed.length) {
              try {
                const resp = await github.rest.actions.downloadJobLogsForWorkflowRun({
                  owner: context.repo.owner, repo: context.repo.repo, job_id: failed[0].id,
                });
                jobLog = String(resp.data || '').slice(-3000);
              } catch (e) { jobLog = `(job log download failed: ${e.message})`; }
            }
            // 三段证据只写纯文本：evidence 里再套 ``` 会让 body 的代码块提前闭合。
            const evidence = [
              steps ? `Failed steps:\n${steps}` : '',
              log ? `Tail of the mutation log:\n${log}` : '(log unavailable — the failing step ran before mutation testing)',
              jobLog ? `Tail of the failing job's log:\n${jobLog}` : '',
            ].filter(Boolean).join('\n\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `acceptance regression — jest benchmark recall gate failed (${new Date().toISOString().slice(0,10)})`,
              labels: ['acceptance-regression'],
              body: `Weekly acceptance run failed the 100% recall gate on the jest benchmark (graphql-tools).\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n\`\`\`\n${evidence}\n\`\`\``,
            });
