w/src/pages/index.tsx","dst":"www/src/components/Features.tsx","line":13},{"src":"www/src/pages/index.tsx","dst":"www/src/components/GithubSponsorButton.tsx","line":14},{"src":"www/src/pages/index.tsx","dst":"www/src/components/GithubStarsButton.tsx","line":15},{"src":"www/src/pages/index.tsx","dst":"www/src/components/Iframe.tsx","line":16},{"src":"www/src/pages/index.tsx","dst":"www/src/components/Preview.tsx","line":17},{"src":"www/src/pages/index.tsx","dst":"www/src/components/QuickIntro.tsx","line":18},{"src":"www/src/pages/index.tsx","dst":"www/src/components/SectionTitle.tsx","line":19},{"src":"www/src/pages/index.tsx","dst":"www/src/components/TwitterWall/index.tsx","line":22},{"src":"www/src/pages/index.tsx","dst":"www/src/components/sponsors/SponsorBubbles.jsx","line":20},{"src":"www/src/pages/index.tsx","dst":"www/src/components/sponsors/TopSponsors.tsx","line":21},{"src":"www/src/pages/index.tsx","dst":"www/src/utils/cn.ts","line":23},{"src":"www/src/pages/index.tsx","dst":"www/src/utils/searchParams.ts","line":24},{"src":"www/src/pages/pricing.tsx","dst":"www/og-image/utils/zodParams.ts","line":5},{"src":"www/src/pages/pricing.tsx","dst":"www/src/components/Button.tsx","line":6},{"src":"www/src/pages/pricing.tsx","dst":"www/src/utils/useEnv.ts","line":7},{"src":"www/src/theme/BlogPostPage/Metadata/index.tsx","dst":"www/og-image/utils/zodParams.ts","line":4},{"src":"www/src/theme/BlogPostPage/Metadata/index.tsx","dst":"www/src/utils/useEnv.ts","line":5},{"src":"www/src/theme/DocItem/Metadata/index.tsx","dst":"www/og-image/utils/zodParams.ts","line":4},{"src":"www/src/theme/DocItem/Metadata/index.tsx","dst":"www/src/utils/useEnv.ts","line":5},{"src":"www/src/utils/useEnv.ts","dst":"www/src/utils/env.js","line":3}]};
const svg = document.getElementById("svg"), vp = document.getElementById("viewport");
const detail = document.getElementById("detail"), crumbs = document.getElementById("crumbs");
let view = { scope: "modules", module: null };

// --- 简单布局：按度数排序的网格+分层 ---
function layout(nodes, edges) {
  const W = svg.clientWidth || 900, H = svg.clientHeight || 600;
  const inDeg = {}; edges.forEach(e => inDeg[e.dst] = (inDeg[e.dst]||0)+e.w);
  const outDeg = {}; edges.forEach(e => outDeg[e.src] = (outDeg[e.src]||0)+e.w);
  // 层级 = 依赖深度近似:被依赖多的沉底
  nodes.forEach(n => { n.score = (inDeg[n.id]||0) - (outDeg[n.id]||0); });
  const sorted = [...nodes].sort((a,b) => a.score - b.score);
  const layers = Math.max(2, Math.min(5, Math.ceil(Math.sqrt(nodes.length))));
  const perLayer = Math.ceil(nodes.length / layers);
  sorted.forEach((n, i) => {
    const layer = Math.floor(i / perLayer), pos = i % perLayer;
    const count = Math.min(perLayer, nodes.length - layer*perLayer);
    n.x = (W / (count+1)) * (pos+1);
    n.y = 80 + (H-160) * (layer / Math.max(1, layers-1));
  });
  return nodes;
}

function esc(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

function render() {
  let nodes, edges;
  if (view.scope === "modules") {
    nodes = DATA.modules.map(m => ({ id: m.name, label: (DATA.moduleMeta[m.name]?.display ?? m.name), meta: m.files + " files" + blindLabel(m.blind), test: m.name === "tests" }));
    edges = DATA.modEdges.map(e => ({ src: e.src, dst: e.dst, w: e.w, cyclic: e.cyclic }));
    crumbs.innerHTML = "模块层 · " + nodes.length + " modules";
  } else {
    const fs = DATA.files.filter(f => f.module === view.module);
    const inSet = new Set(fs.map(f => f.path));
    nodes = fs.map(f => ({ id: f.path, label: f.path.split("/").pop(), meta: f.symbols.length + " symbols" + blindLabel(f.blind), test: false }));
    const agg = {};
    DATA.fileEdges.forEach(e => {
      if (inSet.has(e.src) && inSet.has(e.dst)) { const k = e.src+"→"+e.dst; agg[k] = (agg[k]||0)+1; }
    });
    edges = Object.entries(agg).map(([k,w]) => { const [src,dst] = k.split("→"); return { src, dst, w, cyclic: false }; });
    crumbs.innerHTML = '<span class="crumb" onclick="goHome()">模块层</span> › ' + esc(view.module) + " · " + nodes.length + " files";
  }
  layout(nodes, edges);
  const pos = {}; nodes.forEach(n => pos[n.id] = n);
  let g = "";
  edges.forEach(e => {
    const a = pos[e.src], b = pos[e.dst]; if (!a || !b) return;
    const mx = (a.x+b.x)/2, my = (a.y+b.y)/2 - 20;
    g += '<path class="edge'+(e.cyclic?" cyclic":"")+'" d="M'+a.x+','+a.y+' Q'+mx+','+my+' '+b.x+','+b.y+'"/>';
    g += '<text class="edge-label" x="'+mx+'" y="'+(my+4)+'">'+e.w+'</text>';
  });
  nodes.forEach(n => {
    const w = Math.max(120, n.label.length*8 + 30);
    g += '<g class="node'+(n.test?" test":"")+'" onclick="clickNode(\''+n.id.replace(/'/g,"\\'")+'\')">'
       + '<rect x="'+(n.x-w/2)+'" y="'+(n.y-24)+'" width="'+w+'" height="48"/>'
       + '<text x="'+n.x+'" y="'+(n.y-4)+'" text-anchor="middle">'+esc(n.label)+'</text>'
       + '<text class="meta" x="'+n.x+'" y="'+(n.y+14)+'" text-anchor="middle">'+esc(n.meta)+'</text></g>';
  });
  vp.innerHTML = g;
  renderSide();
}

function renderSide() {
  if (view.scope === "modules") {
    const cyc = DATA.modEdges.filter(e => e.cyclic);
    let h = "";
    if (cyc.length) h += '<div class="cyclic-banner">⚠ 检测到循环依赖: ' + cyc.map(e => esc(e.src)+" ⇄ "+esc(e.dst)).filter((v,i,a)=>a.indexOf(v)===i).slice(0,3).join("; ") + '</div>';
    h += DATA.modules.map(m => '<div class="item" onclick="drill(\''+m.name.replace(/'/g,"\\'")+'\')"><span>'+esc(DATA.moduleMeta[m.name]?.display ?? m.name)+'</span>'+(DATA.moduleMeta[m.name]?.desc ? '<div class="kind">'+esc(DATA.moduleMeta[m.name].desc)+'</div>' : '')+'<span class="kind">'+m.files+' files'+'<span class="blind">'+blindLabel(m.blind)+'</span>'+'</span></div>').join("");
    detail.innerHTML = h;
  }
}

function clickNode(id) {
  if (view.scope === "modules") drill(id);
  else showFile(id);
}
function drill(mod) { view = { scope: "files", module: mod }; render(); }
function goHome() { view = { scope: "modules", module: null }; render(); }
function showFile(path) {
  const f = DATA.files.find(x => x.path === path); if (!f) return;
  detail.innerHTML = '<h2>' + esc(path) + '</h2>'
    + ((f.blind.dyn || f.blind.unres) ? '<div class="cyclic-banner">盲区: '+(f.blind.dyn||0)+' 动态调用（原理性不可达） + '+(f.blind.unres||0)+' 解析失败（可能因缺依赖虚高）— 影响可能被低估</div>' : '')
    + f.symbols.map(s => '<div class="item" '+(DATA.repoUrl?'onclick="window.open(\''+DATA.repoUrl+'/'+path+'#L'+s.line+'\')"':'')+'><span>'+esc(s.name)+'</span><span class="kind">'+s.kind+' :'+s.line+'</span></div>').join("");
}

// 缩放平移
let scale = 1, tx = 0, ty = 0, drag = null;
svg.addEventListener("wheel", e => { e.preventDefault(); scale = Math.max(.3, Math.min(3, scale * (e.deltaY<0?1.1:0.9))); apply(); });
svg.addEventListener("mousedown", e => drag = { x: e.clientX-tx, y: e.clientY-ty });
window.addEventListener("mousemove", e => { if (drag) { tx = e.clientX-drag.x; ty = e.clientY-drag.y; apply(); } });
window.addEventListener("mouseup", () => drag = null);
function apply() { vp.setAttribute("transform", "translate("+tx+","+ty+") scale("+scale+")"); }

render();
window.addEventListener("resize", render);
</script>
