name: modern acceptance

# A forward-looking benchmark, deliberately non-blocking.
# `acceptance.yml` stays pinned to the last-known-good tRPC commit and protects the 100% gate.
# This job exercises a newer tRPC commit so upstream layout changes become visible without turning
# an upstream change into a false release regression. Update MODERN_TRPC_SHA intentionally.

on:
  schedule:
    - cron: '0 4 * * 1' # one hour after the stable acceptance job
  workflow_dispatch:
    inputs:
      mutants:
        description: "Mutation count"
        default: "5"

permissions:
  contents: read

env:
  MODERN_TRPC_SHA: 573d4f33ee2896c2bb7106203a936ae892d1ef1c # 2026-09-12, modern vitest-era baseline

jobs:
  modern-recall:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: bun install
      - run: bun run build
      - name: Clone modern tRPC
        run: |
          git init -q /tmp/trpc-modern
          git -C /tmp/trpc-modern remote add origin https://github.com/trpc/trpc.git
          git -C /tmp/trpc-modern fetch -q --depth 1 origin "$MODERN_TRPC_SHA"
          git -C /tmp/trpc-modern checkout -q FETCH_HEAD
          git -C /tmp/trpc-modern log -1 --format='modern tRPC @ %h %ad' --date=short
      - name: Install benchmark deps
        working-directory: /tmp/trpc-modern
        run: corepack enable && pnpm install --ignore-scripts
      - name: Build graph
        run: node dist/bin.js index /tmp/trpc-modern --db /tmp/trpc-modern.db
      - name: Mutation recall (informational)
        id: mutation
        continue-on-error: true
        run: |
          set +e
          python3 eval/mutation_check.py /tmp/trpc-modern /tmp/trpc-modern.db "${{ github.event.inputs.mutants || 5 }}" 2>&1 | tee /tmp/modern-mutation.log
          STATUS=${PIPESTATUS[0]}
          set -e
          RECALL=$(grep -oP '^recall: \d+/\d+ = \K\d+' /tmp/modern-mutation.log | tail -1 || true)
          CALL_RECALL=$(grep -oP '^call-channel recall: \d+/\d+ = \K\d+' /tmp/modern-mutation.log | tail -1 || true)
          printf 'modern_recall=%s\n' "${RECALL:-unavailable}" >> "$GITHUB_STEP_SUMMARY"
          printf 'modern_call_channel_recall=%s\n' "${CALL_RECALL:-unavailable}" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "## Modern compatibility result"
            echo "- tRPC commit: $MODERN_TRPC_SHA"
            echo "- full impact recall: ${RECALL:-unavailable}"
            echo "- call-channel recall: ${CALL_RECALL:-unavailable}"
            echo "- mutation command exit: $STATUS"
            echo "- interpretation: informational; the pinned acceptance gate remains authoritative"
          } > /tmp/modern-summary.md
          exit 0
      - name: Upload modern report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: modern-acceptance-${{ github.run_id }}
          path: |
            /tmp/modern-mutation.log
            /tmp/modern-summary.md
          if-no-files-found: ignore
