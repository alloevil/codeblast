name: offline replay

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Replay deterministic historical patterns
        run: CODEBLAST_REPLAY_OUT=/tmp/offline-replay.json bun run offline-replay
      - name: Publish scorecard
        if: always()
        run: |
          test -f /tmp/offline-replay.json && cat /tmp/offline-replay.json >> "$GITHUB_STEP_SUMMARY" || true
