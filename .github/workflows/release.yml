name: Release

# Tag push (vX.Y.Z) -> tests -> build dist -> npm publish (provenance) -> GitHub Release with
# <tarball> and <tarball>.intoto.jsonl attached. Requires repo secret NPM_TOKEN.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write      # create the release / upload assets
      id-token: write      # sigstore signing
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
      - name: Node smoke (dist)
        run: node dist/bin.js index . --db /tmp/smoke.db && node dist/bin.js impact /tmp/smoke.db openDatabase --json > /dev/null
      - name: Published-package smoke fixture
        run: |
          smoke=$(mktemp -d)
          trap 'rm -rf "$smoke"' EXIT
          cd "$smoke"
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts "codeblast@${GITHUB_REF_NAME#v}" >/dev/null 2>&1
          ./node_modules/.bin/codeblast --help | grep -q 'check-change'
          git init -q
          git config user.email release@example.com
          git config user.name release
          printf '%s\n' '{"compilerOptions":{"module":"NodeNext","moduleResolution":"NodeNext","target":"ES2022"},"include":["src"]}' > tsconfig.json
          mkdir src
          printf '%s\n' 'export function api(x: string) { return x; }' > src/api.ts
          git add . && git commit -qm base
          printf '%s\n' 'export function api(x: string, y = 1) { return x + y; }' > src/api.ts
          git add . && git commit -qm change
          code=0
          node_modules/.bin/codeblast check-change . HEAD~1 HEAD --json > result.json || code=$?
          test "$code" -le 1
          node "$GITHUB_WORKSPACE/eval/validate-safety.mjs" result.json
      - name: Check tag matches package.json
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          test "$pkg" = "${{ github.ref_name }}" || { echo "tag ${{ github.ref_name }} != package.json $pkg"; exit 1; }
      - name: Pack tarball
        id: pack
        run: echo "file=$(npm pack --ignore-scripts 2>/dev/null | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.file }}
      - name: Create or update release with tarball + provenance
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          FILE: ${{ steps.pack.outputs.file }}
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" "$FILE.intoto.jsonl"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" "$FILE" "$FILE.intoto.jsonl" --clobber
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
