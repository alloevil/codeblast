# codeblast 自举：用当前提交构建的 dist 分析自己的 PR。对外模板见 workflows-template/。
#
# 行为：每个 PR 对比 base↔head 的代码图谱；有结构变化则评论（更新同一条评论），
#       无结构变化保持静默。
name: codeblast
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install repo deps
        run: |
          if [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --ignore-scripts
          elif [ -f bun.lock ] || [ -f bun.lockb ]; then npx --yes bun install
          elif [ -f package-lock.json ]; then npm ci --ignore-scripts
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile && bun run build
      - name: Analyze
        id: analyze
        run: |
          set +e
          node dist/bin.js pr-comment "$GITHUB_WORKSPACE" \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            --repo-url "${{ github.server_url }}/${{ github.repository }}" > /tmp/comment.md
          echo "has_comment=$([ -s /tmp/comment.md ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Comment
        if: steps.analyze.outputs.has_comment == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: codeblast
          path: /tmp/comment.md
